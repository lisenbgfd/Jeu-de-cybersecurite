v
                
                <!-- Lignes de réseau -->
                <div class="network-line" style="top: 32%; left: 46%; width: 8%; transform: rotate(0deg);"></div>
                <div class="network-line" style="top: 46%; left: 31%; width: 14%; transform: rotate(45deg);"></div>
                <div class="network-line" style="top: 46%; left: 55%; width: 14%; transform: rotate(-45deg);"></div>
                <div class="network-line" style="top: 54%; left: 46%; width: 8%; transform: rotate(90deg);"></div>
                
                <!-- Commentaire d'information -->
                <div class="info-comment" id="infoComment">
                    <div class="info-comment-header">
                        <button class="close-btn" onclick="hideInfoComment()">×</button>
                        <h4 id="commentTitle">Titre</h4>
                    </div>
                    <div class="info-comment-content" id="commentContent">
                        <!-- Le contenu sera inséré dynamiquement -->
                    </div>
                </div>
                
                <!-- Spawn Points -->
                <div class="spawn-point" style="top: 5%; left: 50%;"></div>
                <div class="spawn-point" style="top: 15%; left: 85%;"></div>
                <div class="spawn-point" style="top: 35%; left: 95%;"></div>
                <div class="spawn-point" style="top: 65%; left: 95%;"></div>
                <div class="spawn-point" style="top: 85%; left: 85%;"></div>
                <div class="spawn-point" style="top: 95%; left: 50%;"></div>
                <div class="spawn-point" style="top: 85%; left: 15%;"></div>
                <div class="spawn-point" style="top: 65%; left: 5%;"></div>
                <div class="spawn-point" style="top: 35%; left: 5%;"></div>
                <div class="spawn-point" style="top: 15%; left: 15%;"></div>

                <!-- Systèmes de Défense -->
                <div class="defense-system firewall" id="firewall1" style="top: 25%; left: 35%;"></div>
                <div class="defense-system firewall" id="firewall2" style="top: 25%; left: 65%;"></div>
                <div class="defense-system shield" id="shield1" style="top: 20%; left: 35%;"></div>
                <div class="defense-system shield" id="shield2" style="top: 20%; left: 60%;"></div>
            </div>
        </div>

        <!-- Panel de Défense -->
        <div class="panel defense-panel">
            <h3> DÉFENSES</h3>
            <button class="btn btn-defense" onclick="deployFirewall()" id="firewallBtn">
                Firewall Global
                <span class="cost">800€ - Bloque 40%</span>
            </button>
            <button class="btn btn-defense" onclick="deployReverseProxy()" id="proxyBtn">
                Load Balancer
                <span class="cost">2000€ - Réduit 60%</span>
            </button>
            <button class="btn btn-defense" onclick="deployRateLimiting()" id="rateLimitBtn">
                Rate Limiting
                <span class="cost">1200€ - Réduit 30%</span>
            </button>
            <button class="btn btn-defense" onclick="upgradeInfrastructure()" id="infraBtn">
                Infrastructure+
                <span class="cost">4000€ - Réduit 70%</span>
            </button>
            <button class="btn btn-defense" onclick="deployRedundancy()" id="redundancyBtn">
                Redondance
                <span class="cost">3500€ - Failover</span>
            </button>
        </div>

        <!-- Barre de Statut -->
        <div class="status-bar">
            <div class="stat">
                <div class="stat-label">Santé Globale</div>
                <div class="health-bar">
                    <div class="health-fill" id="healthFill" style="width: 100%;"></div>
                </div>
                <div class="stat-value" id="healthText">100%</div>
            </div>
            <div class="stat">
                <div class="stat-label">Budget</div>
                <div class="stat-value" id="budgetText">8000€</div>
            </div>
            <div class="stat">
                <div class="stat-label">Serveurs Actifs</div>
                <div class="stat-value" id="serversText">5/5</div>
            </div>
            <div class="stat">
                <div class="stat-label">Score</div>
                <div class="stat-value" id="scoreText">0</div>
            </div>
        </div>

        <!-- Panel de Logs -->
        <div class="panel logs-panel" id="logsPanel">
            <div id="logs">
                <div class="log-entry log-info">Système multi-serveurs initialisé</div>
                <div class="log-entry log-info">5 serveurs opérationnels</div>
                <div class="log-entry log-success">Budget initial: 8000€</div>
            </div>
        </div>

        <!-- Informations serveur sélectionné -->
        <div class="selected-server-info" id="selectedServerInfo">
            <div class="server-info-header" id="serverInfoHeader">Serveur Sélectionné</div>
            <div class="server-info-item">
                <span class="server-info-label">Type:</span>
                <span class="server-info-value" id="serverType">-</span>
            </div>
            <div class="server-info-item">
                <span class="server-info-label">Santé:</span>
                <span class="server-info-value" id="serverHealth">100%</span>
            </div>
            <div class="server-info-item">
                <span class="server-info-label">Statut:</span>
                <span class="server-info-value" id="serverStatus">Normal</span>
            </div>
            <div class="server-info-item">
                <span class="server-info-label">Défenses:</span>
                <span class="server-info-value" id="serverDefenses">Aucune</span>
            </div>
            <button class="attack-target-btn" onclick="attackSelectedServer()" id="attackTargetBtn">
                Attaquer ce serveur
            </button>
        </div>
    </div>

    <script>
        // Variables globales
        let gameState = {
            phase: 'learning', // 'learning' ou 'challenge'
            health: 100,
            budget: 8000,
            score: 0,
            activeServers: 5,
            selectedServer: null,
            attackActive: false,
            waveNumber: 0,
            defenses: {
                firewall: false,
                reverseProxy: false,
                rateLimiting: false,
                infrastructure: false,
                redundancy: false
            },
            servers: {
                server1: { health: 100, type: 'Web Server', status: 'normal', defenses: [] },
                server2: { health: 100, type: 'DB Server', status: 'normal', defenses: [] },
                server3: { health: 100, type: 'API Server', status: 'normal', defenses: [] },
                server4: { health: 100, type: 'CDN Node', status: 'normal', defenses: [] },
                server5: { health: 100, type: 'Cache Server', status: 'normal', defenses: [] }
            }
        };

        let zoomLevel = 1.0;
        let attackInterval = null;
        let countdownInterval = null;
        let packets = [];
        let spawnPoints = [];
        let challengeWaves = [];
        let currentWave = 0;
        let waveInProgress = false;

        // Initialisation
        document.addEventListener('DOMContentLoaded', function() {
            initializeGame();
            setupEventListeners();
            updateUI();
        });

        function initializeGame() {
            spawnPoints = document.querySelectorAll('.spawn-point');
            generateChallengeWaves();
            addLog(' Simulateur DDoS Multi-Serveurs prêt', 'info');
            addLog(' Mode apprentissage activé - Testez les fonctionnalités', 'info');
        }

        function setupEventListeners() {
            const gameArea = document.getElementById('gameArea');
            let isDragging = false;
            let startX, startY, currentX = 0, currentY = 0;

            gameArea.addEventListener('mousedown', (e) => {
                if (e.target === gameArea || e.target.id === 'gameWorld') {
                    isDragging = true;
                    startX = e.clientX - currentX;
                    startY = e.clientY - currentY;
                    gameArea.style.cursor = 'grabbing';
                }
            });

            document.addEventListener('mousemove', (e) => {
                if (isDragging) {
                    currentX = e.clientX - startX;
                    currentY = e.clientY - startY;
                    const gameWorld = document.getElementById('gameWorld');
                    gameWorld.style.transform = `translate(${currentX}px, ${currentY}px) scale(${zoomLevel})`;
                }
            });

            document.addEventListener('mouseup', () => {
                isDragging = false;
                gameArea.style.cursor = 'grab';
            });
        }

        function generateChallengeWaves() {
            challengeWaves = [
                { name: 'Reconnaissance', duration: 15, intensity: 1, targets: ['server1'] },
                { name: 'Ping Flood', duration: 20, intensity: 2, targets: ['server1', 'server3'] },
                { name: 'Botnet Partiel', duration: 25, intensity: 3, targets: ['server2', 'server4'] },
                { name: 'Attaque Coordonnée', duration: 30, intensity: 4, targets: ['server1', 'server2', 'server3'] },
                { name: 'Botnet Massif', duration: 35, intensity: 5, targets: ['server1', 'server2', 'server3', 'server4', 'server5'] }
            ];
        }

        // Fonctions de zoom
        function zoomIn() {
            if (zoomLevel < 2.0) {
                zoomLevel += 0.2;
                updateZoom();
            }
        }

        function zoomOut() {
            if (zoomLevel > 0.4) {
                zoomLevel -= 0.2;
                updateZoom();
            }
        }

        function resetZoom() {
            zoomLevel = 1.0;
            updateZoom();
            const gameWorld = document.getElementById('gameWorld');
            gameWorld.style.transform = `translate(0px, 0px) scale(${zoomLevel})`;
        }

        function updateZoom() {
            const gameWorld = document.getElementById('gameWorld');
            const currentTransform = gameWorld.style.transform;
            const translateMatch = currentTransform.match(/translate\(([^)]+)\)/);
            const translatePart = translateMatch ? translateMatch[0] : 'translate(0px, 0px)';
            
            gameWorld.style.transform = `${translatePart} scale(${zoomLevel})`;
            document.getElementById('zoomLevel').textContent = zoomLevel.toFixed(1) + 'x';
        }

        // Gestion des phases
        function startChallengePhase() {
            gameState.phase = 'challenge';
            gameState.waveNumber = 0;
            currentWave = 0;
            waveInProgress = false;
            
            document.getElementById('phaseIndicator').textContent = 'MODE DÉFI - Survivez aux 5 vagues d\'attaques';
            document.getElementById('phaseIndicator').classList.add('challenge');
            document.getElementById('attackPanel').classList.add('disabled');
            document.getElementById('challengeBtn').style.display = 'none';
            document.getElementById('resetBtn').style.display = 'inline-block';
            
            addLog(' Mode défi activé - Préparez vos défenses!', 'warning');
            addLog('5 vagues d\'attaques programmées', 'info');
            
            setTimeout(() => {
                startNextWave();
            }, 3000);
        }

        function resetToLearning() {
            gameState.phase = 'learning';
            gameState.health = 100;
            gameState.budget = 8000;
            gameState.score = 0;
            gameState.activeServers = 5;
            gameState.attackActive = false;
            gameState.waveNumber = 0;
            currentWave = 0;
            waveInProgress = false;
            
            // Reset serveurs
            Object.keys(gameState.servers).forEach(serverId => {
                gameState.servers[serverId].health = 100;
                gameState.servers[serverId].status = 'normal';
                gameState.servers[serverId].defenses = [];
                resetServerVisual(serverId);
            });
            
            // Reset défenses
            Object.keys(gameState.defenses).forEach(def => {
                gameState.defenses[def] = false;
            });
            
            document.getElementById('phaseIndicator').textContent = 'PHASE D\'APPRENTISSAGE - Testez librement les attaques et défenses';
            document.getElementById('phaseIndicator').classList.remove('challenge');
            document.getElementById('attackPanel').classList.remove('disabled');
            document.getElementById('challengeBtn').style.display = 'inline-block';
            document.getElementById('resetBtn').style.display = 'none';
            
            clearInterval(attackInterval);
            clearInterval(countdownInterval);
            document.getElementById('countdown').style.display = 'none';
            
            enableAllButtons();
            updateUI();
            addLog(' Retour au mode apprentissage', 'info');
        }

        function startNextWave() {
            if (currentWave >= challengeWaves.length) {
                endChallengePhase(true);
                return;
            }
            
            const wave = challengeWaves[currentWave];
            waveInProgress = true;
            gameState.waveNumber = currentWave + 1;
            
            showWaveAnnouncement(`VAGUE ${gameState.waveNumber}/5: ${wave.name}`);
            addLog(` Vague ${gameState.waveNumber}: ${wave.name} (${wave.duration}s)`, 'warning');
            
            setTimeout(() => {
                startWaveAttack(wave);
            }, 2000);
            
            currentWave++;
        }

        function startWaveAttack(wave) {
            let timeLeft = wave.duration;
            document.getElementById('countdown').style.display = 'block';
            
            countdownInterval = setInterval(() => {
                document.getElementById('countdown').textContent = `Vague ${gameState.waveNumber}: ${timeLeft}s`;
                timeLeft--;
                
                if (timeLeft < 0) {
                    clearInterval(countdownInterval);
                    document.getElementById('countdown').style.display = 'none';
                    waveInProgress = false;
                    
                    setTimeout(() => {
                        if (gameState.health > 0) {
                            startNextWave();
                        }
                    }, 2000);
                }
            }, 1000);
            
            // Lancer l'attaque sur les serveurs ciblés
            attackInterval = setInterval(() => {
                wave.targets.forEach(serverId => {
                    attackServer(serverId, wave.intensity);
                });
            }, 500);
        }

        function endChallengePhase(victory) {
            clearInterval(attackInterval);
            clearInterval(countdownInterval);
            document.getElementById('countdown').style.display = 'none';
            
            if (victory) {
                addLog(' VICTOIRE! Toutes les vagues repoussées!', 'success');
                addLog(` Score final: ${gameState.score}`, 'success');
                gameState.score += 5000;
            } else {
                addLog(' DÉFAITE! Infrastructure compromise', 'error');
                addLog(` Score final: ${gameState.score}`, 'error');
            }
            
            setTimeout(() => {
                resetToLearning();
            }, 5000);
        }

        // Fonctions d'attaque
        function startPingFlood() {
            if (gameState.attackActive) return;
            
            gameState.attackActive = true;
            document.getElementById('stopBtn').disabled = false;
            
            showInfoComment('Ping Flood', 
                'Le Ping Flood envoie des paquets ICMP en masse vers les serveurs cibles. ' +
                'Cette attaque consomme la bande passante et peut surcharger les serveurs moins protégés. ' +
                'Durée: 10 secondes. Impact: Modéré sur tous les serveurs.');
            
            addLog(' Ping Flood lancé', 'error');
            
            attackInterval = setInterval(() => {
                Object.keys(gameState.servers).forEach(serverId => {
                    attackServer(serverId, 1);
                });
            }, 300);
            
            setTimeout(() => {
                stopAttack();
            }, 10000);
        }

        function startBotnetAttack() {
            if (gameState.attackActive) return;
            
            gameState.attackActive = true;
            document.getElementById('stopBtn').disabled = false;
            
            showInfoComment('Botnet Attack', 
                'Attaque distribuée utilisant un réseau de machines compromises. ' +
                'Génère un trafic massif depuis plusieurs sources, rendant le filtrage difficile. ' +
                'Impact très élevé sur l\'infrastructure. Durée: 15 secondes.');
            
            addLog(' Attaque Botnet déclenchée', 'error');
            
            attackInterval = setInterval(() => {
                Object.keys(gameState.servers).forEach(serverId => {
                    attackServer(serverId, 3);
                });
            }, 200);
            
            setTimeout(() => {
                stopAttack();
            }, 15000);
        }

        function startTargetedAttack() {
            if (gameState.attackActive || !gameState.selectedServer) {
                addLog(' Sélectionnez un serveur cible', 'error');
                return;
            }
            
            gameState.attackActive = true;
            document.getElementById('stopBtn').disabled = false;
            
            const serverType = gameState.servers[gameState.selectedServer].type;
            showInfoComment('Attaque Ciblée', 
                `Attaque concentrée sur ${serverType}. ` +
                'Utilise des techniques spécialisées pour exploiter les faiblesses spécifiques du serveur cible. ' +
                'Impact très élevé mais localisé. Durée: 12 secondes.');
            
            addLog(` Attaque ciblée sur ${serverType}`, 'error');
            
            attackInterval = setInterval(() => {
                attackServer(gameState.selectedServer, 4);
            }, 150);
            
            setTimeout(() => {
                stopAttack();
            }, 12000);
        }

        function attackSelectedServer() {
            startTargetedAttack();
        }

        function stopAttack() {
            gameState.attackActive = false;
            clearInterval(attackInterval);
            document.getElementById('stopBtn').disabled = true;
            addLog(' Attaque arrêtée', 'info');
            hideInfoComment();
        }

        function attackServer(serverId, intensity) {
            const server = gameState.servers[serverId];
            if (!server || server.health <= 0) return;
            
            // Calculer les dégâts avec les défenses
            let damage = intensity * 2;
            let blocked = false;
            
            // Appliquer les défenses
            if (gameState.defenses.firewall) {
                if (Math.random() < 0.4) {
                    blocked = true;
                    damage = 0;
                }
            }
            
            if (gameState.defenses.reverseProxy && !blocked) {
                damage *= 0.4;
            }
            
            if (gameState.defenses.rateLimiting && !blocked) {
                damage *= 0.7;
            }
            
            if (gameState.defenses.infrastructure && !blocked) {
                damage *= 0.3;
            }
            
            if (!blocked) {
                server.health = Math.max(0, server.health - damage);
                updateServerVisual(serverId);
                
                if (server.health <= 0) {
                    gameState.activeServers--;
                    addLog(` ${server.type} hors service`, 'error');
                }
            }
            
            // Créer des paquets visuels
            createAttackPackets(serverId, blocked);
            
            // Vérifier l'état global
            updateGlobalHealth();
            updateUI();
            
            if (gameState.health <= 0 && gameState.phase === 'challenge') {
                endChallengePhase(false);
            }
        }

        // Fonctions de défense
        function deployFirewall() {
            const cost = 800;
            if (gameState.budget < cost) {
                addLog(' Budget insuffisant pour le Firewall', 'error');
                return;
            }
            
            gameState.budget -= cost;
            gameState.defenses.firewall = true;
            gameState.score += 100;
            
            showInfoComment('Firewall Global', 
                'Pare-feu périmétrique qui analyse et filtre le trafic entrant. ' +
                'Bloque 40% des paquets malveillants basés sur des signatures connues. ' +
                'Efficace contre les attaques simples mais peut être contourné par des techniques avancées.', 
                'defense');
            
            document.getElementById('firewallBtn').disabled = true;
            document.querySelectorAll('.firewall').forEach(fw => fw.classList.add('active'));
            
            addLog(' Firewall global déployé', 'success');
            updateUI();
        }

        function deployReverseProxy() {
            const cost = 2000;
            if (gameState.budget < cost) {
                addLog(' Budget insuffisant pour le Load Balancer', 'error');
                return;
            }
            
            gameState.budget -= cost;
            gameState.defenses.reverseProxy = true;
            gameState.score += 200;
            
            showInfoComment('Load Balancer', 
                'Répartit le trafic entre plusieurs serveurs et cache les requêtes. ' +
                'Réduit l\'impact des attaques de 60% en distribuant la charge. ' +
                'Inclut des fonctionnalités de cache et de compression pour optimiser les performances.', 
                'defense');
            
            document.getElementById('proxyBtn').disabled = true;
            addLog(' Load Balancer activé', 'success');
            updateUI();
        }

        function deployRateLimiting() {
            const cost = 1200;
            if (gameState.budget < cost) {
                addLog('❌ Budget insuffisant pour le Rate Limiting', 'error');
                return;
            }
            
            gameState.budget -= cost;
            gameState.defenses.rateLimiting = true;
            gameState.score += 150;
            
            showInfoComment('Rate Limiting', 
                'Limite le nombre de requêtes par seconde par IP source. ' +
                'Réduit l\'efficacité des attaques de 30% en throttlant les connexions suspectes. ' +
                'Particulièrement efficace contre les attaques depuis un nombre limité de sources.', 
                'defense');
            
            document.getElementById('rateLimitBtn').disabled = true;
            addLog(' Rate Limiting configuré', 'success');
            updateUI();
        }

        function upgradeInfrastructure() {
            const cost = 4000;
            if (gameState.budget < cost) {
                addLog('Budget insuffisant pour l\'upgrade', 'error');
                return;
            }
            
            gameState.budget -= cost;
            gameState.defenses.infrastructure = true;
            gameState.score += 400;
            
            showInfoComment('Infrastructure+', 
                'Amélioration majeure de l\'infrastructure réseau et serveurs. ' +
                'Augmente la capacité de traitement de 70% et améliore la résilience. ' +
                'Inclut des serveurs plus puissants, plus de bande passante et de meilleurs algorithmes de traitement.', 
                'defense');
            
            document.getElementById('infraBtn').disabled = true;
            Object.keys(gameState.servers).forEach(serverId => {
                const serverEl = document.getElementById(serverId);
                serverEl.classList.add('protected');
            });
            
            addLog(' Infrastructure améliorée', 'success');
            updateUI();
        }

        function deployRedundancy() {
            const cost = 3500;
            if (gameState.budget < cost) {
                addLog(' Budget insuffisant pour la Redondance', 'error');
                return;
            }
            
            gameState.budget -= cost;
            gameState.defenses.redundancy = true;
            gameState.score += 350;
            
            showInfoComment('Redondance', 
                'Déploie des serveurs de backup et des systèmes de failover automatique. ' +
                'Si un serveur tombe, le trafic est automatiquement redirigé vers les backups. ' +
                'Assure une continuité de service même en cas d\'attaque réussie sur certains serveurs.', 
                'defense');
            
            document.getElementById('redundancyBtn').disabled = true;
            addLog(' Système de redondance activé', 'success');
            updateUI();
        }

        // Fonctions visuelles
        function createAttackPackets(targetServerId, blocked) {
            const spawnPoint = spawnPoints[Math.floor(Math.random() * spawnPoints.length)];
            const targetServer = document.getElementById(targetServerId);
            
            if (!spawnPoint || !targetServer) return;
            
            const packet = document.createElement('div');
            packet.className = 'packet' + (blocked ? ' blocked' : '');
            
            const spawnRect = spawnPoint.getBoundingClientRect();
            const targetRect = targetServer.getBoundingClientRect();
            const gameRect = document.getElementById('gameArea').getBoundingClientRect();
            
            const startX = ((spawnRect.left + spawnRect.width/2) - gameRect.left) / gameRect.width * 100;
            const startY = ((spawnRect.top + spawnRect.height/2) - gameRect.top) / gameRect.height * 100;
            const endX = ((targetRect.left + targetRect.width/2) - gameRect.left) / gameRect.width * 100;
            const endY = ((targetRect.top + targetRect.height/2) - gameRect.top) / gameRect.height * 100;
            
            packet.style.left = startX + '%';
            packet.style.top = startY + '%';
            
            document.getElementById('gameWorld').appendChild(packet);
            
            // Animer le paquet
            setTimeout(() => {
                packet.style.left = endX + '%';
                packet.style.top = endY + '%';
                
                setTimeout(() => {
                    if (packet.parentNode) {
                        packet.parentNode.removeChild(packet);
                    }
                }, 1000);
            }, 50);
            
            // Activer le spawn point
            spawnPoint.classList.add('active');
            setTimeout(() => {
                spawnPoint.classList.remove('active');
            }, 500);
        }

        function updateServerVisual(serverId) {
            const server = gameState.servers[serverId];
            const serverEl = document.getElementById(serverId);
            const healthFill = serverEl.querySelector('.server-health-fill');
            
            healthFill.style.width = server.health + '%';
            
            // Mettre à jour les classes CSS
            serverEl.classList.remove('under-attack', 'critical');
            
            if (server.health <= 0) {
                serverEl.style.opacity = '0.3';
                server.status = 'offline';
            } else if (server.health < 30) {
                serverEl.classList.add('critical');
                server.status = 'critical';
            } else if (gameState.attackActive) {
                serverEl.classList.add('under-attack');
                server.status = 'under-attack';
            } else {
                server.status = 'normal';
            }
            
            // Mettre à jour les infos du serveur sélectionné
            if (gameState.selectedServer === serverId) {
                updateSelectedServerInfo();
            }
        }

        function resetServerVisual(serverId) {
            const serverEl = document.getElementById(serverId);
            const healthFill = serverEl.querySelector('.server-health-fill');
            
            healthFill.style.width = '100%';
            serverEl.style.opacity = '1';
            serverEl.classList.remove('under-attack', 'critical', 'protected');
        }

        function updateGlobalHealth() {
            const totalHealth = Object.values(gameState.servers).reduce((sum, server) => sum + server.health, 0);
            gameState.health = Math.round(totalHealth / Object.keys(gameState.servers).length);
        }

        function selectServer(serverId) {
            // Désélectionner l'ancien serveur
            if (gameState.selectedServer) {
                document.getElementById(gameState.selectedServer).classList.remove('selected');
            }
            
            // Sélectionner le nouveau serveur
            gameState.selectedServer = serverId;
            document.getElementById(serverId).classList.add('selected');
            
            updateSelectedServerInfo();
            document.getElementById('selectedServerInfo').classList.add('visible');
        }

        function updateSelectedServerInfo() {
            if (!gameState.selectedServer) return;
            
            const server = gameState.servers[gameState.selectedServer];
            document.getElementById('serverType').textContent = server.type;
            document.getElementById('serverHealth').textContent = server.health + '%';
            document.getElementById('serverStatus').textContent = server.status;
            document.getElementById('serverDefenses').textContent = server.defenses.length > 0 ? server.defenses.join(', ') : 'Aucune';
            
            const attackBtn = document.getElementById('attackTargetBtn');
            attackBtn.disabled = gameState.attackActive || gameState.phase === 'challenge';
        }

        function showWaveAnnouncement(text) {
            const announcement = document.getElementById('waveAnnouncement');
            announcement.textContent = text;
            announcement.style.display = 'block';
            
            setTimeout(() => {
                announcement.style.display = 'none';
            }, 3000);
        }

        function showInfoComment(title, content, type = 'attack') {
            const comment = document.getElementById('infoComment');
            const titleEl = document.getElementById('commentTitle');
            const contentEl = document.getElementById('commentContent');
            
            titleEl.textContent = title;
            contentEl.innerHTML = '<p>' + content + '</p>';
            
            comment.className = 'info-comment visible';
            if (type === 'defense') {
                comment.classList.add('defense');
            }
        }

        function hideInfoComment() {
            document.getElementById('infoComment').classList.remove('visible');
        }

        function updateUI() {
            document.getElementById('healthFill').style.width = gameState.health + '%';
            document.getElementById('healthText').textContent = gameState.health + '%';
            document.getElementById('budgetText').textContent = gameState.budget + '€';
            document.getElementById('serversText').textContent = gameState.activeServers + '/5';
            document.getElementById('scoreText').textContent = gameState.score;
        }

        function enableAllButtons() {
            document.querySelectorAll('.btn').forEach(btn => {
                btn.disabled = false;
            });
        }

        function addLog(message, type = 'info') {
            const logs = document.getElementById('logs');
            const entry = document.createElement('div');
            entry.className = `log-entry log-${type}`;
            entry.textContent = new Date().toLocaleTimeString() + ' - ' + message;
            
            logs.appendChild(entry);
            logs.scrollTop = logs.scrollHeight;
            
            // Garder seulement les 20 derniers logs
            while (logs.children.length > 20) {
                logs.removeChild(logs.firstChild);
            }
        }

        // Initialisation finale
        updateUI();
    </script>
</body>
</html>
