<!DOCTYPE html>
<html lang="fr">
<head>
    <!-- ... (le reste du head reste inchangé) ... -->
    <style>
        /* ... (styles existants) ... */

        /* Nouveaux styles pour les différents types de paquets */
        .packet.ping {
            background: radial-gradient(circle, #ff0000, #cc0000);
            box-shadow: 0 0 6px rgba(255, 0, 0, 0.6);
        }

        .packet.botnet {
            width: 8px;
            height: 8px;
            background: radial-gradient(circle, #ff6600, #cc4400);
            box-shadow: 0 0 10px rgba(255, 102, 0, 0.8);
        }

        .packet.targeted {
            width: 10px;
            height: 4px;
            background: linear-gradient(to right, #ff0000, #cc0000);
            border-radius: 2px;
            box-shadow: 0 0 8px rgba(255, 0, 0, 0.6);
        }

        .packet.advanced {
            background: radial-gradient(circle, #ff00ff, #cc00cc);
            box-shadow: 0 0 10px rgba(255, 0, 255, 0.8);
        }

        .packet.social {
            background: radial-gradient(circle, #00ff00, #00cc00);
            box-shadow: 0 0 10px rgba(0, 255, 0, 0.8);
        }

        .packet.ultimate {
            width: 12px;
            height: 12px;
            background: radial-gradient(circle, #ffff00, #ff6600);
            box-shadow: 0 0 15px rgba(255, 255, 0, 0.9);
            animation: ultimatePulse 0.5s infinite alternate;
        }

        @keyframes ultimatePulse {
            from { transform: scale(1); }
            to { transform: scale(1.5); }
        }

        /* Icônes de défense sur les serveurs */
        .defense-icon {
            position: absolute;
            font-size: 8px;
            width: 14px;
            height: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            z-index: 10;
        }

        .defense-icon.firewall {
            bottom: 2px;
            left: 2px;
            background: rgba(255, 0, 0, 0.7);
        }

        .defense-icon.proxy {
            bottom: 2px;
            right: 2px;
            background: rgba(0, 100, 255, 0.7);
        }

        .defense-icon.ratelimit {
            top: 2px;
            left: 2px;
            background: rgba(255, 165, 0, 0.7);
        }

        .defense-icon.infra {
            top: 2px;
            right: 2px;
            background: rgba(0, 200, 0, 0.7);
        }

        .defense-icon.redundancy {
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 200, 200, 0.7);
            font-size: 6px;
        }
    </style>
</head>
<body>
    <!-- ... (le reste du HTML reste inchangé) ... -->
    
    <script>
        // ... (code existant) ...

        function createAttackPackets(targetServerId, blocked, attackType = 'ping') {
            const spawnPoint = spawnPoints[Math.floor(Math.random() * spawnPoints.length)];
            const targetServer = document.getElementById(targetServerId);
            
            if (!spawnPoint || !targetServer) return;
            
            const packet = document.createElement('div');
            packet.className = `packet ${attackType}` + (blocked ? ' blocked' : '');
            
            const spawnRect = spawnPoint.getBoundingClientRect();
            const targetRect = targetServer.getBoundingClientRect();
            const gameRect = document.getElementById('gameArea').getBoundingClientRect();
            
            const startX = ((spawnRect.left + spawnRect.width/2) - gameRect.left) / gameRect.width * 100;
            const startY = ((spawnRect.top + spawnRect.height/2) - gameRect.top) / gameRect.height * 100;
            const endX = ((targetRect.left + targetRect.width/2) - gameRect.left) / gameRect.width * 100;
            const endY = ((targetRect.top + targetRect.height/2) - gameRect.top) / gameRect.height * 100;
            
            packet.style.left = startX + '%';
            packet.style.top = startY + '%';
            
            document.getElementById('gameWorld').appendChild(packet);
            
            // Animer le paquet
            setTimeout(() => {
                packet.style.left = endX + '%';
                packet.style.top = endY + '%';
                
                setTimeout(() => {
                    if (packet.parentNode) {
                        packet.parentNode.removeChild(packet);
                    }
                }, 1000);
            }, 50);
            
            // Activer le spawn point
            spawnPoint.classList.add('active');
            setTimeout(() => {
                spawnPoint.classList.remove('active');
            }, 500);
        }

        function addDefenseIcon(serverId, defenseType) {
            const serverEl = document.getElementById(serverId);
            if (!serverEl) return;
            
            // Vérifier si l'icône est déjà présente
            const existingIcon = serverEl.querySelector(`.defense-icon.${defenseType}`);
            if (existingIcon) return;
            
            const icon = document.createElement('div');
            icon.className = `defense-icon ${defenseType}`;
            
            // Texte de l'icône en fonction du type
            switch(defenseType) {
                case 'firewall': 
                    icon.textContent = 'F';
                    break;
                case 'proxy':
                    icon.textContent = 'LB';
                    break;
                case 'ratelimit':
                    icon.textContent = 'RL';
                    break;
                case 'infra':
                    icon.textContent = 'UP';
                    break;
                case 'redundancy':
                    icon.textContent = 'R';
                    break;
                default:
                    icon.textContent = '?';
            }
            
            serverEl.appendChild(icon);
        }

        // Fonctions de défense modifiées pour ajouter les icônes
        function deployFirewall() {
            // ... (code existant) ...
            
            // Ajouter l'icône sur tous les serveurs
            Object.keys(gameState.servers).forEach(serverId => {
                addDefenseIcon(serverId, 'firewall');
            });
            
            // ... (suite du code) ...
        }

        function deployReverseProxy() {
            // ... (code existant) ...
            
            // Ajouter l'icône sur tous les serveurs
            Object.keys(gameState.servers).forEach(serverId => {
                addDefenseIcon(serverId, 'proxy');
            });
        }

        function deployRateLimiting() {
            // ... (code existant) ...
            
            // Ajouter l'icône sur tous les serveurs
            Object.keys(gameState.servers).forEach(serverId => {
                addDefenseIcon(serverId, 'ratelimit');
            });
        }

        function upgradeInfrastructure() {
            // ... (code existant) ...
            
            // Ajouter l'icône sur tous les serveurs
            Object.keys(gameState.servers).forEach(serverId => {
                addDefenseIcon(serverId, 'infra');
            });
        }

        function deployRedundancy() {
            // ... (code existant) ...
            
            // Ajouter l'icône sur tous les serveurs
            Object.keys(gameState.servers).forEach(serverId => {
                addDefenseIcon(serverId, 'redundancy');
            });
        }

        function resetServerVisual(serverId) {
            const serverEl = document.getElementById(serverId);
            const healthFill = serverEl.querySelector('.server-health-fill');
            
            healthFill.style.width = '100%';
            serverEl.style.opacity = '1';
            serverEl.classList.remove('under-attack', 'critical', 'protected');
            
            // Retirer toutes les icônes de défense
            const icons = serverEl.querySelectorAll('.defense-icon');
            icons.forEach(icon => icon.remove());
        }

        function attackServer(serverId, intensity) {
            // ... (code existant) ...
            
            // Créer des paquets visuels - par défaut ping
            createAttackPackets(serverId, blocked, 'ping');
        }

        function attackServerAdvanced(serverId, intensity) {
            // ... (code existant) ...
            
            // Créer des paquets pour attaque avancée
            createAttackPackets(serverId, blocked, 'advanced');
        }

        function attackServerSocial(serverId, intensity) {
            // ... (code existant) ...
            
            // Créer des paquets pour attaque sociale
            createAttackPackets(serverId, false, 'social');
        }

        function attackServerUltimate(serverId, intensity) {
            // ... (code existant) ...
            
            // Créer des paquets pour attaque ultime
            createAttackPackets(serverId, blocked, 'ultimate');
        }

        function startPingFlood() {
            // ... (code existant) ...
            
            attackInterval = setInterval(() => {
                Object.keys(gameState.servers).forEach(serverId => {
                    attackServer(serverId, 1);
                    // Créer des paquets spécifiques
                    createAttackPackets(serverId, false, 'ping');
                });
            }, 300);
            
            // ... (suite du code) ...
        }

        function startBotnetAttack() {
            // ... (code existant) ...
            
            attackInterval = setInterval(() => {
                Object.keys(gameState.servers).forEach(serverId => {
                    attackServer(serverId, 3);
                    // Créer des paquets spécifiques
                    createAttackPackets(serverId, false, 'botnet');
                });
            }, 200);
        }

        function startTargetedAttack() {
            // ... (code existant) ...
            
            attackInterval = setInterval(() => {
                attackServer(gameState.selectedServer, 4);
                // Créer des paquets spécifiques
                createAttackPackets(gameState.selectedServer, false, 'targeted');
            }, 150);
        }

        function startTargetedAttack() {
            if (gameState.attackActive || !gameState.selectedServer) {
                addLog(' Sélectionnez un serveur cible', 'error');
                return;
            }
            
            gameState.attackActive = true;
            document.getElementById('stopBtn').disabled = false;
            
            const serverType = gameState.servers[gameState.selectedServer].type;
            showInfoComment('Attaque Ciblée', 
                `Attaque concentrée sur ${serverType}. ` +
                'Utilise des techniques spécialisées pour exploiter les faiblesses spécifiques du serveur cible. ' +
                'Impact très élevé mais localisé. Durée: 12 secondes.');
            
            addLog(` Attaque ciblée sur ${serverType}`, 'error');
            
            attackInterval = setInterval(() => {
                attackServer(gameState.selectedServer, 4);
            }, 150);
            
            setTimeout(() => {
                stopAttack();
            }, 12000);
        }

        function attackSelectedServer() {
            startTargetedAttack();
        }

        function stopAttack() {
            gameState.attackActive = false;
            clearInterval(attackInterval);
            document.getElementById('stopBtn').disabled = true;
            addLog(' Attaque arrêtée', 'info');
            hideInfoComment();
        }

        function attackServer(serverId, intensity) {
            const server = gameState.servers[serverId];
            if (!server || server.health <= 0) return;
            
            // Calculer les dégâts avec les défenses
            let damage = intensity * 2;
            let blocked = false;
            
            // Appliquer les défenses
            if (gameState.defenses.firewall) {
                if (Math.random() < 0.4) {
                    blocked = true;
                    damage = 0;
                }
            }
            
            if (gameState.defenses.reverseProxy && !blocked) {
                damage *= 0.4;
            }
            
            if (gameState.defenses.rateLimiting && !blocked) {
                damage *= 0.7;
            }
            
            if (gameState.defenses.infrastructure && !blocked) {
                damage *= 0.3;
            }
            
            if (!blocked) {
                server.health = Math.max(0, server.health - damage);
                updateServerVisual(serverId);
                
                if (server.health <= 0) {
                    gameState.activeServers--;
                    addLog(` ${server.type} hors service`, 'error');
                }
            }
            
            // Créer des paquets visuels
            createAttackPackets(serverId, blocked);
            
            // Vérifier l'état global
            updateGlobalHealth();
            updateUI();
            
            if (gameState.health <= 0 && gameState.phase === 'challenge') {
                endChallengePhase(false);
            }
        }

        // Fonctions de défense
        function deployFirewall() {
            const cost = 800;
            if (gameState.budget < cost) {
                addLog(' Budget insuffisant pour le Firewall', 'error');
                return;
            }
            
            gameState.budget -= cost;
            gameState.defenses.firewall = true;
            gameState.score += 100;
            
            showInfoComment('Firewall Global', 
                'Pare-feu périmétrique qui analyse et filtre le trafic entrant. ' +
                'Bloque 40% des paquets malveillants basés sur des signatures connues. ' +
                'Efficace contre les attaques simples mais peut être contourné par des techniques avancées.', 
                'defense');
            
            document.getElementById('firewallBtn').disabled = true;
            document.querySelectorAll('.firewall').forEach(fw => fw.classList.add('active'));
            
            addLog(' Firewall global déployé', 'success');
            updateUI();
        }

        function deployReverseProxy() {
            const cost = 2000;
            if (gameState.budget < cost) {
                addLog(' Budget insuffisant pour le Load Balancer', 'error');
                return;
            }
            
            gameState.budget -= cost;
            gameState.defenses.reverseProxy = true;
            gameState.score += 200;
            
            showInfoComment('Load Balancer', 
                'Répartit le trafic entre plusieurs serveurs et cache les requêtes. ' +
                'Réduit l\'impact des attaques de 60% en distribuant la charge. ' +
                'Inclut des fonctionnalités de cache et de compression pour optimiser les performances.', 
                'defense');
            
            document.getElementById('proxyBtn').disabled = true;
            addLog(' Load Balancer activé', 'success');
            updateUI();
        }

        function deployRateLimiting() {
            const cost = 1200;
            if (gameState.budget < cost) {
                addLog(' Budget insuffisant pour le Rate Limiting', 'error');
                return;
            }
            
            gameState.budget -= cost;
            gameState.defenses.rateLimiting = true;
            gameState.score += 150;
            
            showInfoComment('Rate Limiting', 
                'Limite le nombre de requêtes par seconde par IP source. ' +
                'Réduit l\'efficacité des attaques de 30% en throttlant les connexions suspectes. ' +
                'Particulièrement efficace contre les attaques depuis un nombre limité de sources.', 
                'defense');
            
            document.getElementById('rateLimitBtn').disabled = true;
            addLog(' Rate Limiting configuré', 'success');
            updateUI();
        }

        function upgradeInfrastructure() {
            const cost = 4000;
            if (gameState.budget < cost) {
                addLog('Budget insuffisant pour l\'upgrade', 'error');
                return;
            }
            
            gameState.budget -= cost;
            gameState.defenses.infrastructure = true;
            gameState.score += 400;
            
            showInfoComment('Infrastructure+', 
                'Amélioration majeure de l\'infrastructure réseau et serveurs. ' +
                'Augmente la capacité de traitement de 70% et améliore la résilience. ' +
                'Inclut des serveurs plus puissants, plus de bande passante et de meilleurs algorithmes de traitement.', 
                'defense');
            
            document.getElementById('infraBtn').disabled = true;
            Object.keys(gameState.servers).forEach(serverId => {
                const serverEl = document.getElementById(serverId);
                serverEl.classList.add('protected');
            });
            
            addLog(' Infrastructure améliorée', 'success');
            updateUI();
        }

        function deployRedundancy() {
    const cost = 3500;
    if (gameState.budget < cost) {
        addLog('Budget insuffisant pour la Redondance', 'error');
        return;
    }
    
    gameState.budget -= cost;
    gameState.defenses.redundancy = true;
    gameState.score += 350;
    
    showInfoComment('Redondance', 
        'Déploie des serveurs de sauvegarde et des systèmes de failover automatique. ' +
        'Si un serveur tombe, le trafic est automatiquement redirigé vers les backups. ' +
        'Assure une continuité de service même en cas d\'attaque réussie sur certains serveurs.', 
        'defense');
    
    document.getElementById('redundancyBtn').disabled = true;
    
    // Ajouter un effet visuel de redondance sur tous les serveurs
    Object.keys(gameState.servers).forEach(serverId => {
        const serverEl = document.getElementById(serverId);
        if (serverEl) {
            // Ajouter une classe CSS pour l'effet de redondance
            serverEl.style.boxShadow = '0 0 20px rgba(0, 255, 255, 0.6)';
            serverEl.style.border = '2px solid rgba(0, 255, 255, 0.5)';
            
            // Créer un indicateur de backup visuel
            if (!serverEl.querySelector('.backup-indicator')) {
                const backupIndicator = document.createElement('div');
                backupIndicator.className = 'backup-indicator';
                backupIndicator.style.cssText = `
                    position: absolute;
                    top: -8px;
                    right: -8px;
                    width: 16px;
                    height: 16px;
                    background: radial-gradient(circle, #00ffff, #0088cc);
                    border-radius: 50%;
                    animation: backupPulse 2s infinite;
                    font-size: 8px;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    color: black;
                    font-weight: bold;
                `;
                backupIndicator.textContent = 'B';
                serverEl.appendChild(backupIndicator);
            }
        }
    });
    
    // Ajouter l'animation CSS si elle n'existe pas déjà
    if (!document.querySelector('#backup-animation-style')) {
        const style = document.createElement('style');
        style.id = 'backup-animation-style';
        style.textContent = `
            @keyframes backupPulse {
                0%, 100% { opacity: 0.7; transform: scale(1); }
                50% { opacity: 1; transform: scale(1.2); }
            }
        `;
        document.head.appendChild(style);
    }
    
    addLog(' Système de redondance activé', 'success');
    addLog(' Serveurs de backup déployés', 'info');
    updateUI();
}

            const endX = ((targetRect.left + targetRect.width/2) - gameRect.left) / gameRect.width * 100;

            // Activer le spawn point

        function updateServerVisual(serverId) {
            const server = gameState.servers[serverId];
            const serverEl = document.getElementById(serverId);
            const healthFill = serverEl.querySelector('.server-health-fill');
            
            healthFill.style.width = server.health + '%';
            
            // Mettre à jour les classes CSS
            serverEl.classList.remove('under-attack', 'critical');
            
            if (server.health <= 0) {
                serverEl.style.opacity = '0.3';
                server.status = 'offline';
            } else if (server.health < 30) {
                serverEl.classList.add('critical');
                server.status = 'critical';
            } else if (gameState.attackActive) {
                serverEl.classList.add('under-attack');
                server.status = 'under-attack';
            } else {
                server.status = 'normal';
            }
            
            // Mettre à jour les infos du serveur sélectionné
            if (gameState.selectedServer === serverId) {
                updateSelectedServerInfo();
            }
        }

        function resetServerVisual(serverId) {
            const serverEl = document.getElementById(serverId);
            const healthFill = serverEl.querySelector('.server-health-fill');
            
            healthFill.style.width = '100%';
            serverEl.style.opacity = '1';
            serverEl.classList.remove('under-attack', 'critical', 'protected');
        }

        function updateGlobalHealth() {
            const totalHealth = Object.values(gameState.servers).reduce((sum, server) => sum + server.health, 0);
            gameState.health = Math.round(totalHealth / Object.keys(gameState.servers).length);
        }

        function selectServer(serverId) {
            // Désélectionner l'ancien serveur
            if (gameState.selectedServer) {
                document.getElementById(gameState.selectedServer).classList.remove('selected');
            }
            
            // Sélectionner le nouveau serveur
            gameState.selectedServer = serverId;
            document.getElementById(serverId).classList.add('selected');
            
            updateSelectedServerInfo();
            document.getElementById('selectedServerInfo').classList.add('visible');
        }

        function updateSelectedServerInfo() {
            if (!gameState.selectedServer) return;
            
            const server = gameState.servers[gameState.selectedServer];
            document.getElementById('serverType').textContent = server.type;
            document.getElementById('serverHealth').textContent = server.health + '%';
            document.getElementById('serverStatus').textContent = server.status;
            document.getElementById('serverDefenses').textContent = server.defenses.length > 0 ? server.defenses.join(', ') : 'Aucune';
            
            const attackBtn = document.getElementById('attackTargetBtn');
            attackBtn.disabled = gameState.attackActive || gameState.phase === 'challenge';
        }

        function showWaveAnnouncement(text) {
            const announcement = document.getElementById('waveAnnouncement');
            announcement.textContent = text;
            announcement.style.display = 'block';
            
            setTimeout(() => {
                announcement.style.display = 'none';
            }, 3000);
        }

        function showInfoComment(title, content, type = 'attack') {
            const comment = document.getElementById('infoComment');
            const titleEl = document.getElementById('commentTitle');
            const contentEl = document.getElementById('commentContent');
            
            titleEl.textContent = title;
            contentEl.innerHTML = '<p>' + content + '</p>';
            
            comment.className = 'info-comment visible';
            if (type === 'defense') {
                comment.classList.add('defense');
            }
        }

        function hideInfoComment() {
            document.getElementById('infoComment').classList.remove('visible');
        }

        function updateUI() {
            document.getElementById('healthFill').style.width = gameState.health + '%';
            document.getElementById('healthText').textContent = gameState.health + '%';
            document.getElementById('budgetText').textContent = gameState.budget + '€';
            document.getElementById('serversText').textContent = gameState.activeServers + '/5';
            document.getElementById('scoreText').textContent = gameState.score;
        }

        function enableAllButtons() {
            document.querySelectorAll('.btn').forEach(btn => {
                btn.disabled = false;
            });
        }

        function addLog(message, type = 'info') {
            const logs = document.getElementById('logs');
            const entry = document.createElement('div');
            entry.className = `log-entry log-${type}`;
            entry.textContent = new Date().toLocaleTimeString() + ' - ' + message;
            
            logs.appendChild(entry);
            logs.scrollTop = logs.scrollHeight;
            
            // Garder seulement les 20 derniers logs
            while (logs.children.length > 20) {
                logs.removeChild(logs.firstChild);
            }
        }

        // Fonction à ajouter dans votre script JavaScript
function startAttackMode() {
    gameState.phase = 'attack';
    gameState.botnetCount = 100;
    gameState.bandwidthCount = 1000;
    
    // Modifier l'interface pour le mode attaque
    document.getElementById('phaseIndicator').textContent = 'MODE ATTAQUE - Utilisez vos ressources pour attaquer l\'infrastructure';
    document.getElementById('phaseIndicator').classList.add('attack-mode');
    
    // Afficher les ressources d'attaque
    document.getElementById('attackResources').style.display = 'block';
    
    // Désactiver le panel de défense
    document.querySelector('.defense-panel').classList.add('disabled');
    
    // Modifier les boutons de contrôle
    document.getElementById('challengeBtn').style.display = 'none';
    document.getElementById('attackModeBtn').style.display = 'none';
    document.getElementById('resetBtn').style.display = 'inline-block';
    
    // Activer les attaques avancées
    document.getElementById('advancedAttackBtn').style.display = 'inline-block';
    document.getElementById('socialEngineeringBtn').style.display = 'inline-block';
    
    // Modifier les textes des boutons d'attaque pour montrer le coût en ressources
    document.getElementById('pingFloodCost').textContent = '10 bots - 50 Mbps';
    document.getElementById('botnetAttackCost').textContent = '50 bots - 200 Mbps';
    document.getElementById('targetedAttackCost').textContent = '20 bots - 100 Mbps';
    
    updateAttackResources();
    addLog(' Mode attaque activé - Ressources disponibles', 'warning');
    addLog(' Botnet: 100 bots, Bande passante: 1000 Mbps', 'info');
}

// Fonction pour mettre à jour l'affichage des ressources
function updateAttackResources() {
    document.getElementById('botnetCount').textContent = gameState.botnetCount || 0;
    document.getElementById('bandwidthCount').textContent = gameState.bandwidthCount || 0;
    
    // Mettre à jour les barres de progression
    const botnetPercentage = (gameState.botnetCount / 100) * 100;
    const bandwidthPercentage = (gameState.bandwidthCount / 1000) * 100;
    
    document.getElementById('botnetBar').style.width = botnetPercentage + '%';
    document.getElementById('bandwidthBar').style.width = bandwidthPercentage + '%';
    
    // Changer la couleur des barres selon le niveau
    const botnetBar = document.getElementById('botnetBar');
    const bandwidthBar = document.getElementById('bandwidthBar');
    
    if (botnetPercentage < 20) {
        botnetBar.style.backgroundColor = '#ff4444';
    } else if (botnetPercentage < 50) {
        botnetBar.style.backgroundColor = '#ffaa00';
    } else {
        botnetBar.style.backgroundColor = '#44ff44';
    }
    
    if (bandwidthPercentage < 20) {
        bandwidthBar.style.backgroundColor = '#ff4444';
    } else if (bandwidthPercentage < 50) {
        bandwidthBar.style.backgroundColor = '#ffaa00';
    } else {
        bandwidthBar.style.backgroundColor = '#44ff44';
    }
}

// Fonction pour consommer des ressources lors d'une attaque
function consumeAttackResources(botsUsed, bandwidthUsed) {
    if (gameState.phase !== 'attack') return true;
    
    if (gameState.botnetCount < botsUsed || gameState.bandwidthCount < bandwidthUsed) {
        addLog(' Ressources insuffisantes pour cette attaque', 'error');
        return false;
    }
    
    gameState.botnetCount -= botsUsed;
    gameState.bandwidthCount -= bandwidthUsed;
    
    updateAttackResources();
    return true;
}

// Fonction d'attaque avancée qui contourne partiellement les défenses
function attackServerAdvanced(serverId, intensity) {
    const server = gameState.servers[serverId];
    if (!server || server.health <= 0) return;
    
    let damage = intensity * 2;
    let blocked = false;
    
    // L'attaque avancée contourne 70% des défenses
    if (gameState.defenses.firewall && Math.random() > 0.7) {
        if (Math.random() < 0.4) {
            blocked = true;
            damage = 0;
        }
    }
    
    if (gameState.defenses.reverseProxy && !blocked && Math.random() > 0.7) {
        damage *= 0.4;
    }
    
    if (gameState.defenses.rateLimiting && !blocked && Math.random() > 0.7) {
        damage *= 0.7;
    }
    
    if (gameState.defenses.infrastructure && !blocked) {
        damage *= 0.5; // Infrastructure reste partiellement efficace
    }
    
    if (!blocked) {
        server.health = Math.max(0, server.health - damage);
        updateServerVisual(serverId);
        
        if (server.health <= 0) {
            gameState.activeServers--;
            addLog(` ${server.type} neutralisé par attaque avancée`, 'error');
        }
    }
    
    createAttackPackets(serverId, blocked);
    updateGlobalHealth();
    updateUI();
}

// Fonction d'attaque sociale qui ignore certaines défenses
function attackServerSocial(serverId, intensity) {
    const server = gameState.servers[serverId];
    if (!server || server.health <= 0) return;
    
    let damage = intensity * 2;
    
    // L'ingénierie sociale ignore firewall et rate limiting
    if (gameState.defenses.reverseProxy) {
        damage *= 0.6;
    }
    
    if (gameState.defenses.infrastructure) {
        damage *= 0.4;
    }
    
    server.health = Math.max(0, server.health - damage);
    updateServerVisual(serverId);
    
    if (server.health <= 0) {
        gameState.activeServers--;
        addLog(` ${server.type} compromis par ingénierie sociale`, 'error');
    }
    
    createAttackPackets(serverId, false);
    updateGlobalHealth();
    updateUI();
}
// Fonction pour démarrer le mode attaque - à ajouter à la fin de votre script
function startAttackMode() {
    // Changer l'état du jeu
    gameState.phase = 'attack';
    gameState.attackResources = {
        botnet: 100,
        bandwidth: 1000,
        exploits: 5
    };
    
    // Modifier l'interface
    document.getElementById('phaseIndicator').textContent = 'MODE ATTAQUE - Percez les défenses de l\'infrastructure';
    document.getElementById('phaseIndicator').classList.add('attack-mode');
    document.getElementById('phaseIndicator').style.backgroundColor = '#cc0000';
    document.getElementById('phaseIndicator').style.color = 'white';
    
    // Désactiver le panel de défense
    const defensePanel = document.querySelector('.defense-panel');
    if (defensePanel) {
        defensePanel.style.opacity = '0.3';
        defensePanel.style.pointerEvents = 'none';
    }
    
    // Modifier les boutons de contrôle
    const challengeBtn = document.getElementById('challengeBtn');
    const resetBtn = document.getElementById('resetBtn');
    
    if (challengeBtn) challengeBtn.style.display = 'none';
    if (resetBtn) resetBtn.style.display = 'inline-block';
    
    // Ajouter des ressources d'attaque dans l'interface
    const statsPanel = document.querySelector('.stats-panel');
    if (statsPanel && !document.getElementById('attackResourcesDisplay')) {
        const resourcesDiv = document.createElement('div');
        resourcesDiv.id = 'attackResourcesDisplay';
        resourcesDiv.innerHTML = `
            <div style="background: #2a0a0a; padding: 10px; border-radius: 5px; margin-top: 10px; border: 1px solid #ff4444;">
                <h4 style="color: #ff4444; margin: 0 0 10px 0;"> RESSOURCES D'ATTAQUE</h4>
                <div style="display: flex; justify-content: space-between; color: white; font-size: 12px;">
                    <span>Botnet: <span id="botnetDisplay">${gameState.attackResources.botnet}</span></span>
                    <span>Bande passante: <span id="bandwidthDisplay">${gameState.attackResources.bandwidth}</span> Mbps</span>
                    <span>Exploits: <span id="exploitsDisplay">${gameState.attackResources.exploits}</span></span>
                </div>
            </div>
        `;
        statsPanel.appendChild(resourcesDiv);
    }
    
    // Modifier les attaques existantes pour consommer des ressources
    gameState.originalAttackFunctions = {
        startPingFlood: window.startPingFlood,
        startBotnetAttack: window.startBotnetAttack,
        startTargetedAttack: window.startTargetedAttack
    };
    
    // Redéfinir les fonctions d'attaque avec consommation de ressources
    window.startPingFlood = function() {
        if (gameState.attackActive) return;
        
        if (gameState.attackResources.botnet < 10 || gameState.attackResources.bandwidth < 50) {
            addLog(' Ressources insuffisantes (besoin: 10 bots, 50 Mbps)', 'error');
            return;
        }
        
        // Consommer les ressources
        gameState.attackResources.botnet -= 10;
        gameState.attackResources.bandwidth -= 50;
        updateAttackResourcesDisplay();
        
        // Lancer l'attaque originale
        gameState.originalAttackFunctions.startPingFlood();
        addLog(' Ping Flood lancé (-10 bots, -50 Mbps)', 'error');
    };
    
    window.startBotnetAttack = function() {
        if (gameState.attackActive) return;
        
        if (gameState.attackResources.botnet < 30 || gameState.attackResources.bandwidth < 200) {
            addLog(' Ressources insuffisantes (besoin: 30 bots, 200 Mbps)', 'error');
            return;
        }
        
        // Consommer les ressources
        gameState.attackResources.botnet -= 30;
        gameState.attackResources.bandwidth -= 200;
        updateAttackResourcesDisplay();
        
        // Lancer l'attaque originale
        gameState.originalAttackFunctions.startBotnetAttack();
        addLog(' Attaque Botnet lancée (-30 bots, -200 Mbps)', 'error');
    };
    
    window.startTargetedAttack = function() {
        if (gameState.attackActive) return;
        
        if (gameState.attackResources.botnet < 20 || gameState.attackResources.bandwidth < 100 || gameState.attackResources.exploits < 1) {
            addLog(' Ressources insuffisantes (besoin: 20 bots, 100 Mbps, 1 exploit)', 'error');
            return;
        }
        
        if (!gameState.selectedServer) {
            addLog(' Sélectionnez un serveur cible', 'error');
            return;
        }
        
        // Consommer les ressources
        gameState.attackResources.botnet -= 20;
        gameState.attackResources.bandwidth -= 100;
        gameState.attackResources.exploits -= 1;
        updateAttackResourcesDisplay();
        
        // Lancer l'attaque originale
        gameState.originalAttackFunctions.startTargetedAttack();
        addLog('Attaque ciblée lancée (-20 bots, -100 Mbps, -1 exploit)', 'error');
    };
    
    // Ajouter une attaque ultime
    if (!document.getElementById('ultimateAttackBtn')) {
        const attackPanel = document.getElementById('attackPanel');
        if (attackPanel) {
            const ultimateBtn = document.createElement('button');
            ultimateBtn.id = 'ultimateAttackBtn';
            ultimateBtn.className = 'btn attack-btn';
            ultimateBtn.innerHTML = ' ATTAQUE ULTIME';
            ultimateBtn.style.backgroundColor = '#660000';
            ultimateBtn.style.borderColor = '#990000';
            ultimateBtn.onclick = startUltimateAttack;
            attackPanel.appendChild(ultimateBtn);
        }
    }
    
    addLog(' MODE ATTAQUE ACTIVÉ', 'warning');
    addLog(' Objectif: Percer toutes les défenses avec vos ressources limitées', 'info');
    addLog('Ressources: 100 bots, 1000 Mbps, 5 exploits', 'info');
}

// Fonction pour mettre à jour l'affichage des ressources
function updateAttackResourcesDisplay() {
    const botnetDisplay = document.getElementById('botnetDisplay');
    const bandwidthDisplay = document.getElementById('bandwidthDisplay');
    const exploitsDisplay = document.getElementById('exploitsDisplay');
    
    if (botnetDisplay) botnetDisplay.textContent = gameState.attackResources.botnet;
    if (bandwidthDisplay) bandwidthDisplay.textContent = gameState.attackResources.bandwidth;
    if (exploitsDisplay) exploitsDisplay.textContent = gameState.attackResources.exploits;
    
    // Vérifier si les ressources sont épuisées
    if (gameState.attackResources.botnet <= 0 && gameState.attackResources.bandwidth <= 0) {
        addLog(' RESSOURCES ÉPUISÉES - Retour au mode apprentissage', 'error');
        setTimeout(() => {
            resetToLearning();
        }, 3000);
    }
}

// Attaque ultime qui coûte toutes les ressources restantes
function startUltimateAttack() {
    if (gameState.attackActive) return;
    
    if (gameState.attackResources.botnet < 50 || gameState.attackResources.bandwidth < 500 || gameState.attackResources.exploits < 3) {
        addLog('Ressources insuffisantes pour l\'attaque ultime (besoin: 50 bots, 500 Mbps, 3 exploits)', 'error');
        return;
    }
    
    gameState.attackActive = true;
    document.getElementById('stopBtn').disabled = false;
    
    // Consommer massivement les ressources
    gameState.attackResources.botnet -= 50;
    gameState.attackResources.bandwidth -= 500;
    gameState.attackResources.exploits -= 3;
    updateAttackResourcesDisplay();
    
    showInfoComment(' ATTAQUE ULTIME', 
        'Déploiement de toutes les techniques d\'attaque simultanément. ' +
        'Utilise des exploits zero-day, du trafic massif distribué et des techniques d\'évasion avancées. ' +
        'Cette attaque ignore 80% des défenses et cause des dégâts dévastateurs. ' +
        'Coût: 50 bots, 500 Mbps, 3 exploits. Durée: 20 secondes.');
    
    addLog(' ATTAQUE ULTIME DÉCLENCHÉE - TOUS LES SYSTÈMES SOUS STRESS MAXIMAL', 'error');
    
    attackInterval = setInterval(() => {
        Object.keys(gameState.servers).forEach(serverId => {
            // Attaque qui ignore la plupart des défenses 
            attackServerUltimate(serverId, 8); 
        });
    }, 100);
    
    setTimeout(() => { 
        stopAttack(); 
        addLog(' Attaque ultime terminée - Infrastructure critique', 'error'); 
    }, 20000); 
} 

// Fonction d'attaque ultime
function attackServerUltimate(serverId, intensity) {
    const server = gameState.servers[serverId];
    if (!server || server.health <= 0) return;
    
    let damage = intensity * 3;
    let blocked = false;
    
    // L'attaque ultime ignore 80% des défenses 
    if (gameState.defenses.firewall && Math.random() > 0.8) {
        if (Math.random() < 0.4) { 
            blocked = true; 
            damage = 0; 
        }
    }
    
    if (gameState.defenses.reverseProxy && !blocked && Math.random() > 0.8) { 
        damage *= 0.4;
    }
    
    if (gameState.defenses.rateLimiting && !blocked && Math.random() > 0.8) {
        damage *= 0.7;
    }
    
    if (gameState.defenses.infrastructure && !blocked && Math.random() > 0.5) {
        damage *= 0.3;
    }
    
    if (!blocked) {
        server.health = Math.max(0, server.health - damage);
        updateServerVisual(serverId);
        
        if (server.health <= 0) {
            gameState.activeServers--;
            addLog(` ${server.type} DÉTRUIT par l'attaque ultime`, 'error');
        }
    }
    
    createAttackPackets(serverId, blocked);  
    updateGlobalHealth();  
    updateUI();  
    
    // Vérifier la victoire de l'attaquant
    if (gameState.health <= 10) { 
        addLog(' VICTOIRE DE L\'ATTAQUANT - Infrastructure compromise', 'error');  
        setTimeout(() => {  
            resetToLearning();  
        }, 3000);  
    }
}

// Modifier la fonction resetToLearning pour restaurer les fonctions originales
const originalResetToLearning = resetToLearning; 
resetToLearning = function() { 
    // Restaurer les fonctions d'attaque originales si elles existent
    if (gameState.originalAttackFunctions) {  
        window.startPingFlood = gameState.originalAttackFunctions.startPingFlood;  
        window.startBotnetAttack = gameState.originalAttackFunctions.startBotnetAttack;  
        window.startTargetedAttack = gameState.originalAttackFunctions.startTargetedAttack;  
        delete gameState.originalAttackFunctions;  
    }
    
    // Supprimer l'affichage des ressources d'attaque 
    const attackResourcesDisplay = document.getElementById('attackResourcesDisplay');  
    if (attackResourcesDisplay) {  
        attackResourcesDisplay.remove();  
    }
    
    // Supprimer le bouton d'attaque ultime
    const ultimateBtn = document.getElementById('ultimateAttackBtn'); 
    if (ultimateBtn) { 
        ultimateBtn.remove(); 
    }
    
    // Restaurer l'interface
    document.getElementById('phaseIndicator').classList.remove('attack-mode'); 
    document.getElementById('phaseIndicator').style.backgroundColor = ''; 
    document.getElementById('phaseIndicator').style.color = ''; 
    
    const defensePanel = document.querySelector('.defense-panel');
    if (defensePanel) {
        defensePanel.style.opacity = '';
        defensePanel.style.pointerEvents = '';
    }
    
    // Appeler la fonction de reset originale
    originalResetToLearning(); 
};

        updateUI();
